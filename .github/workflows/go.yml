name: Go

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read
  security-events: write
  actions: read
  pull-requests: write

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  # Security scanning is handled by dedicated security.yml workflow
  # This ensures separation of concerns and better maintainability
  security-gate:
    name: Security Gate
    runs-on: ubuntu-latest  
    needs: test
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Quick dependency review for PR blocking
    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: critical
        fail-on-scopes: runtime
        comment-summary-in-pr: on-failure